name: Acquisition reliability checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest>=7,<9'
      - run: make -C Linux_Wrapper
      - run: python -m pytest -q
      - run: bash -n Linux_Wrapper/install.sh
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'platformio>=6,<7'
      - run: pio run
